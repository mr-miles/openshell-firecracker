[package]
name = "openshell-firecracker-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Firecracker VM launcher plugin for the OpenShell VM compute driver"
publish = false

[lib]
name = "openshell_firecracker_launcher"
path = "src/lib.rs"

[[bin]]
name = "openshell-firecracker-launcher"
path = "src/main.rs"

# No OpenShell crates: the launcher speaks only the stock VM driver's
# command-line contract, so it builds on its own and is not tied to an OpenShell
# release at compile time.
[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1", features = ["process", "fs"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
