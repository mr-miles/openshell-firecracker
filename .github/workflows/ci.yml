name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        # debugfs and mke2fs exercise the guest environment injection test.
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Unit tests
        run: cargo test --all-targets

  build:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: openshell-firecracker-launcher-x86_64-linux
          path: target/release/openshell-firecracker-launcher
          if-no-files-found: error
