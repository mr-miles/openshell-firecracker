name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        # debugfs and mke2fs exercise the guest environment injection test.
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      # Installs the pinned toolchain from mise.toml and caches it.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'mise.toml') }}
          restore-keys: check-${{ runner.os }}-
      - name: rustfmt
        run: mise run rust:format:check
      - name: clippy
        run: mise run rust:lint
      - name: Unit tests
        run: mise run rust:test

  build:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ runner.os }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'mise.toml') }}
          restore-keys: build-${{ runner.os }}-
      - name: Build and package
        run: mise run package:launcher
      - uses: actions/upload-artifact@v7
        with:
          name: openshell-firecracker-launcher-x86_64-linux
          path: dist/*
          if-no-files-found: error
