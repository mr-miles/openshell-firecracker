# Builds the release assets install.sh downloads, and publishes them.
#
#   openshell-firecracker-launcher-<arch>-linux.tar.gz   the launcher
#   openshell-firecracker-kernel-<arch>-linux.tar.gz     the guest kernel (vmlinux)
#   openshell-driver-vm-<arch>-linux.tar.gz              the VM driver (vendor/openshell)
#   openshell-commit.txt                                 the OpenShell revision it is from
#   examples.tar.gz, install.sh, SHA256SUMS
#
# Every step is a mise task (tasks/*.toml), so a local `mise run` does the same.
# Push a tag such as v0.1.0 to publish. workflow_dispatch builds the assets
# without publishing, to check the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build and package
        run: mise run package:launcher
      - uses: actions/upload-artifact@v7
        with:
          name: launcher
          path: dist/*
          if-no-files-found: error

  # The guest kernel is built here so users need no C toolchain: install.sh downloads it.
  kernel:
    name: Guest kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: Install the kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libelf-dev libssl-dev xz-utils
      - name: Build and package
        run: mise run kernel:package
      - uses: actions/upload-artifact@v7
        with:
          name: kernel
          path: dist/*
          if-no-files-found: error

  # The VM driver, vendored in vendor/openshell. Compiling is the slow part: the
  # supervisor and guest binaries come from the pinned OpenShell revision
  # (driver/UPSTREAM.env), then the driver embeds them. Both target directories are
  # cached per pin.
  driver:
    name: VM driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            openshell/target
            vendor/openshell/target
            ~/.cargo/registry
            ~/.cargo/git
          key: driver-${{ runner.arch }}-${{ hashFiles('driver/**', 'vendor/openshell/Cargo.lock', 'tasks/driver.toml', 'mise.toml') }}
          restore-keys: driver-${{ runner.arch }}-
      # Fetches the pinned OpenShell revision, builds its host supervisor and static
      # guest binaries with its own bundling script, downloads umoci, then builds the
      # vendored driver with those embedded. Only Rust, zig and cargo-zigbuild are
      # installed; not OpenShell's full toolchain.
      - name: Build and package
        run: mise run driver:package
      - uses: actions/upload-artifact@v7
        with:
          name: driver
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [launcher, kernel, driver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add the installer, examples and checksums
        env:
          REPO: ${{ github.repository }}
        run: mise run package:assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
