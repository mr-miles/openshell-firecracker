# Builds the release assets install.sh downloads, and publishes them.
#
#   openshell-firecracker-launcher-<arch>-linux.tar.gz   the launcher
#   openshell-driver-vm-interim-<arch>-linux.tar.gz      INTERIM driver, built against the
#                                                        latest OpenShell release
#   openshell-version.txt                                which OpenShell release that is
#   examples.tar.gz, install.sh, SHA256SUMS
#
# Every step is a mise task (tasks/*.toml), so a local `mise run` does the same.
# Push a tag such as v0.1.0 to publish. workflow_dispatch builds the assets
# without publishing, to check the build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build and package
        run: mise run package:launcher
      - uses: actions/upload-artifact@v7
        with:
          name: launcher
          path: dist/*
          if-no-files-found: error

  # INTERIM: delete this job with the interim/ directory once the upstream
  # launcher override ships (see interim/README.md).
  driver:
    name: Interim driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Resolves the latest OpenShell release, checks it out, patches in the launcher
      # override, stages that release's runtime artifacts (host supervisor, guest
      # sandbox and init, umoci, libkrun) with OpenShell's own mise tasks, then
      # builds OpenShell's VM driver and packages it.
      - name: Build and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run interim:package
      - uses: actions/upload-artifact@v7
        with:
          name: driver
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [launcher, driver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add the installer, examples and checksums
        env:
          REPO: ${{ github.repository }}
        run: mise run package:assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
