# INTERIM: delete this file together with the interim/ directory and
# tasks/interim.toml once the upstream launcher override ships
# (see interim/README.md).
name: Interim driver

on:
  push:
    branches: [main]
    paths:
      - "interim/**"
      - "tasks/interim.toml"
      - ".github/workflows/interim-driver.yml"
  pull_request:
    paths:
      - "interim/**"
      - "tasks/interim.toml"
      - ".github/workflows/interim-driver.yml"

permissions:
  contents: read

jobs:
  patch:
    name: Test the launcher-override patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # The patch is applied to OpenShell's own file at release time. This tests
      # it against a fixture; the full driver build runs in the release workflow.
      - name: Test
        run: mise run interim:ci
