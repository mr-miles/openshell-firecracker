# INTERIM: delete this file together with the interim/ directory once the upstream
# launcher override ships (see interim/README.md).
#
# Builds OpenShell's own VM driver from the latest release, with a two-line patch
# that adds OPENSHELL_VM_LAUNCHER_BIN. Nothing of OpenShell's is copied here: the
# patch is applied to a checkout of the release at build time, so it always matches.

["interim:test"]
description = "Test the launcher-override patch against a fixture (needs only bash)"
run = "bash interim/test.sh"

["interim:ci"]
description = "Everything CI checks for the interim driver"
depends = ["interim:test"]

["interim:version"]
description = "Resolve the OpenShell release to build against: OPENSHELL_TAG, else the latest stable (needs gh)"
run = '''
set -eu
tag="${OPENSHELL_TAG:-$(gh api repos/NVIDIA/OpenShell/releases/latest --jq .tag_name)}"
case "$tag" in
  v[0-9]*) ;;
  *) echo "unexpected OpenShell tag: $tag" >&2; exit 1 ;;
esac
mkdir -p dist
printf '%s\n' "$tag" > dist/openshell-version.txt
echo "building against OpenShell $tag"
'''

["interim:checkout"]
description = "Check out that OpenShell release (into OPENSHELL_DIR, default ./openshell)"
depends = ["interim:version"]
run = '''
set -eu
dir="${OPENSHELL_DIR:-openshell}"
tag="$(cat dist/openshell-version.txt)"
if [ ! -d "$dir/.git" ]; then
  # $dir may already hold a restored build cache (target/), so clone beside it and
  # merge rather than cloning into a non-empty directory.
  tmp="$dir.clone"
  rm -rf "$tmp"
  git clone --depth 1 --branch "$tag" https://github.com/NVIDIA/OpenShell "$tmp"
  mkdir -p "$dir"
  cp -a "$tmp/." "$dir/"
  rm -rf "$tmp"
fi
'''

["interim:patch"]
description = "Patch the checkout's VM driver: OPENSHELL_VM_LAUNCHER_BIN and the guest /dev/fd links"
depends = ["interim:checkout"]
run = '''
set -eu
dir="${OPENSHELL_DIR:-openshell}"
bash interim/apply-launcher-override.sh "$dir/crates/openshell-driver-vm/src/main.rs"
bash interim/apply-guest-init-fix.sh "$dir/crates/openshell-driver-vm/scripts/openshell-vm-sandbox-init.sh"
'''

["interim:runtime"]
description = "Stage the runtime artifacts the driver embeds, with OpenShell's own tasks"
depends = ["interim:patch"]
run = '''
set -eu
dir="$(cd "${OPENSHELL_DIR:-openshell}" && pwd)"
# Deliberately not `mise install` / `mise run` inside the OpenShell checkout: its
# mise.toml pulls in Python, Go, Node, Helm and more, none of which these steps
# need. Every mise call here runs from this repo's root, so only our mise.toml
# (Rust) applies, plus the two tools OpenShell's supervisor build prefers.
target="$(uname -m)-unknown-linux-musl"
mise exec -- rustup target add "$target"

# OpenShell's scripts read GITHUB_REPOSITORY (which Actions sets to *this* repo) to
# decide where to download release artifacts from. Point them at OpenShell.
export GITHUB_REPOSITORY=NVIDIA/OpenShell

# Same pins as OpenShell's mise.toml. Needs also: gh, zstd, curl, tar (present on
# GitHub's Ubuntu runners; install them elsewhere).
mise exec zig@0.14.1 "github:rust-cross/cargo-zigbuild@0.22.3" -- bash -euc '
  cd "$1"
  tasks/scripts/vm/vm-setup.sh
  tasks/scripts/vm/build-supervisor-bundle.sh
' _ "$dir"
'''

["interim:package"]
description = "Build the patched VM driver and package it into dist/"
depends = ["interim:runtime"]
run = '''
set -eu
dir="$(cd "${OPENSHELL_DIR:-openshell}" && pwd)"
# mise runs from this repo's root (Rust only); cargo then builds in the checkout.
OPENSHELL_VM_RUNTIME_COMPRESSED_DIR="$dir/target/vm-runtime-compressed" \
  mise exec -- bash -euc 'cd "$1" && cargo build --release -p openshell-driver-vm' _ "$dir"
stage="$(mktemp -d)"
install -m 0755 "$dir/target/release/openshell-driver-vm" "$stage/openshell-driver-vm-interim"
mkdir -p dist
tar -czf "dist/openshell-driver-vm-interim-$(uname -m)-linux.tar.gz" -C "$stage" openshell-driver-vm-interim
rm -rf "$stage"
'''
