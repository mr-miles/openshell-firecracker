# Release packaging. The release workflow runs these; so can you.
#
# dist/ ends up holding what install.sh downloads:
#   openshell-firecracker-launcher-<arch>-linux.tar.gz   package:launcher
#   openshell-firecracker-kernel-<arch>-linux.tar.gz     kernel:package
#   openshell-driver-vm-<arch>-linux.tar.gz              driver:package
#   openshell-commit.txt                                 driver:package
#   install.sh, examples.tar.gz, SHA256SUMS              package:assets

["package:launcher"]
description = "Build the launcher and package it into dist/"
depends = ["rust:build"]
run = [
  "mkdir -p dist",
  "tar -czf dist/openshell-firecracker-launcher-$(uname -m)-linux.tar.gz -C target/release openshell-firecracker-launcher",
]

["package:assets"]
description = "Add the installer, examples and checksums to dist/ (set REPO=owner/name)"
run = '''
set -eu
mkdir -p dist
# The installer carries the repository it downloads from.
sed "s|@REPO@|${REPO:?set REPO=owner/name}|" install.sh > dist/install.sh
chmod +x dist/install.sh
tar -czf dist/examples.tar.gz examples
cd dist
sha256sum $(ls | grep -v ^SHA256SUMS$) > SHA256SUMS
cat SHA256SUMS
'''
